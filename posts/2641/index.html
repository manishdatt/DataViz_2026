<h2 class="text-2xl lg:text-3xl mb-4">TidyTuesday dataset of <a
        href="https://github.com/rfordatascience/tidytuesday/blob/main/data/2026/{{ date }}">{{ date }}</a></h2>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repairs Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
    <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highcharts/11.4.0/highcharts.min.js"></script>
    <script type="module">
        import { getName } from 'https://cdn.jsdelivr.net/npm/country-list@2.3.0/+esm';
        window.getCountryName = getName;
    </script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">Repairs Data</h1>
        <div id="repairs-table" class="mb-8"></div>
        <h1 class="text-3xl font-bold mb-6 text-gray-800">Repairs Timeline</h1>
        <div id="repairs-timeline" class="mb-8" style="height: 1000px;"></div>
        <h1 class="text-3xl font-bold mb-6 text-gray-800">Repairs Text Data</h1>
        <div id="repairs-text-table"></div>
    </div>
    <script>
        function createTabulator(tableId, url) {
            fetch(url)
                .then(response => response.text())
                .then(csvData => {
                    const rows = csvData.split('\n').map(row => row.split(',').map(cell => cell.trim().replace(/^"|"$/g, '')));
                    const headers = rows[0];
                    const data = rows.slice(1).filter(row => row.length === headers.length && row.some(cell => cell !== '')).map(row => {
                        const obj = {};
                        headers.forEach((header, i) => {
                            obj[header] = row[i];
                        });
                        return obj;
                    });

                    const columns = headers.map(header => ({
                        title: header,
                        field: header,
                        headerFilter: "input"
                    }));

                    new Tabulator(tableId, {
                        data: data,
                        columns: columns,
                        layout: "fitColumns",
                        pagination: "local",
                        paginationSize: 10,
                    });
                });
        }

        function createTimeline(url) {
            fetch(url)
                .then(response => response.text())
                .then(csvData => {
                    const rows = csvData.split('\n').map(row => row.split(',').map(cell => cell.trim().replace(/^"|"$/g, '')));
                    const headers = rows[0];
                    const repairDateIndex = headers.indexOf('repair_date');
                    const repairedIndex = headers.findIndex(h => h.toLowerCase().includes('repaired'));
                    const countryIndex = headers.indexOf('country');

                    if (repairDateIndex === -1 || repairedIndex === -1 || countryIndex === -1) {
                        console.error('Required columns not found');
                        return;
                    }

                    const countries = [...new Set(rows.slice(1)
                        .filter(row => row[countryIndex] && row[countryIndex].trim() !== '')
                        .map(row => row[countryIndex].trim()))];

                    const countryNames = countries.map(code => {
                        let name = window.getCountryName ? window.getCountryName(code) : code;
                        if (!name) name = code;
                        if (name.includes('United Kingdom')) name = 'United Kingdom';
                        return name;
                    });

                    const repairedCategories = ['yes', 'no', 'half'];

                    const seriesData = [];
                    const colors = ['#7cb5ec', '#90ed7d', '#f7a35c'];
                    const symbols = ['circle', 'square', 'diamond'];
                    const legendNames = ['Yes', 'No', 'Half'];
                    countries.forEach((country, countryIdx) => {
                        repairedCategories.forEach((repaired, rIdx) => {
                            const points = rows.slice(1)
                                .filter(row => row[repairDateIndex] && row[repairedIndex] && row[countryIndex] && row[repairedIndex].trim().toLowerCase() === repaired && row[countryIndex].trim() === country)
                                .map(row => {
                                    const date = new Date(row[repairDateIndex].trim());
                                    if (isNaN(date.getTime())) return null;
                                    const offset = (rIdx - 1) * 0.2;
                                    return [date.getTime(), countryIdx + offset];
                                })
                                .filter(p => p !== null);
                            if (points.length > 0) {
                                seriesData.push({
                                    name: legendNames[rIdx],
                                    data: points,
                                    color: colors[rIdx],
                                    marker: { radius: 4, symbol: symbols[rIdx] },
                                    showInLegend: countryIdx === 0
                                });
                            }
                        });
                    });

                    Highcharts.chart('repairs-timeline', {
                        chart: { type: 'scatter' },
                        title: { text: 'Repairs Over Time by Country' },
                        xAxis: {
                            type: 'datetime',
                            title: { text: '' }
                        },
                        yAxis: {
                            title: { text: '' },
                            categories: countryNames,
                            tickInterval: 1,
                            min: 0,
                            max: countries.length - 1
                        },
                        series: seriesData,
                        credits: { enabled: false },
                        tooltip: {
                            formatter: function() {
                                const date = new Date(this.x);
                                const countryIdx = Math.round(this.y);
                                const country = countryNames[countryIdx] || 'Unknown';
                                return `<b>${country}</b><br/>Date: ${date.toLocaleDateString()}<br/>Repaired: ${this.series.name}`;
                            }
                        }
                    });
                });
        }

        createTabulator("#repairs-table", 'https://raw.githubusercontent.com/rfordatascience/tidytuesday/main/data/2026/2026-04-07/repairs.csv');
        createTabulator("#repairs-text-table", 'https://raw.githubusercontent.com/rfordatascience/tidytuesday/main/data/2026/2026-04-07/repairs_text.csv');
        createTimeline('https://raw.githubusercontent.com/rfordatascience/tidytuesday/main/data/2026/2026-04-07/repairs.csv');
    </script>
</body>
