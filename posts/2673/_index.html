<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NDE Experiences</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-full mx-auto">
    <h1 class="text-2xl font-bold mb-4">NDE Experiences</h1>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
      <div id="chart-container" class="bg-white rounded-lg shadow p-4"></div>
      <div id="radar-container" class="bg-white rounded-lg shadow p-4"></div>
    </div>
    <div id="donut-container" class="bg-white rounded-lg shadow p-4 mb-6"></div>

    <div class="overflow-x-auto bg-white rounded-lg shadow">
      <table class="min-w-full text-sm" id="data-table">
        <thead class="bg-gray-800 text-white" id="table-head"></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <div class="flex items-center justify-between mt-4">
      <button id="prev-btn" class="px-4 py-2 bg-gray-800 text-white rounded disabled:opacity-50" disabled>Previous</button>
      <span id="page-info" class="text-gray-700"></span>
      <button id="next-btn" class="px-4 py-2 bg-gray-800 text-white rounded disabled:opacity-50">Next</button>
    </div>
  </div>
  <script>
    const PER_PAGE = 10;
    let currentPage = 1;
    let allData = [];
    let headers = [];

    Papa.parse('nde_experiences.csv', {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        headers = results.meta.fields;
        allData = results.data;
        renderPage(1);
        renderChart(allData);
        renderRadar(allData);
        renderDonut(allData);
      }
    });

    function renderChart(data) {
      var chartData = data.filter(function(d) {
        return d.exp_date && d.exp_date !== 'NA' && d.greyson_score !== 'NA' && !isNaN(+d.greyson_score);
      }).map(function(d) {
        return { date: new Date(d.exp_date), score: +d.greyson_score, gender: d.gender };
      }).sort(function(a, b) { return a.date - b.date; });

      var genderGroups = d3.group(chartData, function(d) { return d.gender; });

      var margin = { top: 40, right: 80, bottom: 60, left: 60 };
      var width = 960 - margin.left - margin.right;
      var height = 450 - margin.top - margin.bottom;

      var svg = d3.select('#chart-container').append('svg')
        .attr('viewBox', '0 0 960 450')
        .attr('width', '100%')
        .append('g')
        .attr('transform', 'translate(' + margin.left + ',' + margin.top + ')');

      var x = d3.scaleTime().domain(d3.extent(chartData, function(d) { return d.date; })).range([0, width]);
      var y = d3.scaleLinear().domain([0, d3.max(chartData, function(d) { return d.score; })]).nice().range([height, 0]);

      var color = d3.scaleOrdinal().domain(Array.from(genderGroups.keys())).range(d3.schemeSet2);

      svg.append('g').attr('transform', 'translate(0,' + height + ')')
        .call(d3.axisBottom(x).ticks(10).tickFormat(d3.timeFormat('%Y')))
        .selectAll('text').attr('transform', 'rotate(-45)').style('text-anchor', 'end');
      svg.append('g').call(d3.axisLeft(y));

      svg.append('text').attr('x', width / 2).attr('y', height + 50).attr('text-anchor', 'middle').text('Experience Date');
      svg.append('text').attr('transform', 'rotate(-90)').attr('x', -height / 2).attr('y', -45).attr('text-anchor', 'middle').text('Greyson Score');

      genderGroups.forEach(function(points, gender) {
        var sorted = points.sort(function(a, b) { return a.date - b.date; });

        svg.append('path')
          .datum(sorted)
          .attr('fill', 'none')
          .attr('stroke', color(gender))
          .attr('stroke-width', 1.5)
          .attr('stroke-opacity', 0.6)
          .attr('d', d3.line().x(function(d) { return x(d.date); }).y(function(d) { return y(d.score); }));

        svg.selectAll(null)
          .data(sorted)
          .enter()
          .append('circle')
          .attr('cx', function(d) { return x(d.date); })
          .attr('cy', function(d) { return y(d.score); })
          .attr('r', 3.5)
          .attr('fill', color(gender))
          .attr('opacity', 0.8);
      });

      var legend = svg.selectAll('.legend')
        .data(color.domain())
        .enter().append('g')
        .attr('transform', function(d, i) { return 'translate(' + (width + 15) + ',' + (i * 25) + ')'; });

      legend.append('rect').attr('width', 14).attr('height', 14).attr('fill', color);
      legend.append('text').attr('x', 18).attr('y', 11).text(function(d) { return d; }).style('font-size', '12px');
    }

    function renderRadar(data) {
      var aiCols = ['ai_obe','ai_unity','ai_hellish','ai_clinical','ai_esp','ai_past_lives','ai_world_future','ai_aliens'];
      var genders = ['M','F'];

      var pct = genders.map(function(g) {
        var rows = data.filter(function(d) { return d.gender === g; });
        return {
          gender: g,
          values: aiCols.map(function(col) {
            var total = rows.length;
            var trues = rows.filter(function(d) { return d[col] === 'TRUE'; }).length;
            return { axis: col, value: total ? trues / total : 0 };
          })
        };
      });

      var radius = 180;
      var size = (radius + 60) * 2;
      var center = size / 2;

      var svg = d3.select('#radar-container').append('svg')
        .attr('viewBox', '0 0 ' + size + ' ' + size)
        .attr('width', '100%')
        .append('g').attr('transform', 'translate(' + center + ',' + center + ')');

      var rScale = d3.scaleLinear().domain([0, 1]).range([0, radius]);
      var angleSlice = Math.PI * 2 / 8;

      var color = d3.scaleOrdinal().domain(['M','F']).range(['#4e79a7','#e15759']);

      for (var level = 1; level <= 5; level++) {
        var r = radius * level / 5;
        svg.append('circle').attr('r', r).attr('fill', 'none').attr('stroke', '#ddd').attr('stroke-width', 0.5);
        svg.append('text').attr('x', 3).attr('y', -r).attr('fill', '#999').style('font-size', '10px').text((level * 20) + '%');
      }

      aiCols.forEach(function(col, i) {
        var angle = angleSlice * i - Math.PI / 2;
        svg.append('line')
          .attr('x1', 0).attr('y1', 0)
          .attr('x2', radius * Math.cos(angle))
          .attr('y2', radius * Math.sin(angle))
          .attr('stroke', '#ccc').attr('stroke-width', 0.5);

        var labelR = radius + 20;
        svg.append('text')
          .attr('x', labelR * Math.cos(angle))
          .attr('y', labelR * Math.sin(angle))
          .attr('text-anchor', 'middle')
          .attr('dominant-baseline', 'middle')
          .style('font-size', '10px')
          .text(col);
      });

      pct.forEach(function(d) {
        var points = d.values.map(function(v, i) {
          var angle = angleSlice * i - Math.PI / 2;
          return { x: rScale(v.value) * Math.cos(angle), y: rScale(v.value) * Math.sin(angle) };
        });

        svg.append('polygon')
          .attr('points', points.map(function(p) { return p.x + ',' + p.y; }).join(' '))
          .attr('fill', color(d.gender))
          .attr('fill-opacity', 0.15)
          .attr('stroke', color(d.gender))
          .attr('stroke-width', 2);

        points.forEach(function(p) {
          svg.append('circle').attr('cx', p.x).attr('cy', p.y).attr('r', 4).attr('fill', color(d.gender));
        });
      });

      var legend = svg.selectAll('.legend')
        .data(color.domain())
        .enter().append('g')
        .attr('transform', function(d, i) { return 'translate(' + (-radius + 10) + ',' + (-radius - 25 + i * 20) + ')'; });

      legend.append('rect').attr('width', 12).attr('height', 12).attr('fill', color);
      legend.append('text').attr('x', 16).attr('y', 10).text(function(d) { return d === 'M' ? 'Male' : 'Female'; }).style('font-size', '11px');
    }

    function renderDonut(data) {
      var aiCols = ['ai_obe','ai_unity','ai_hellish','ai_clinical','ai_esp','ai_past_lives','ai_world_future','ai_aliens'];
      var genders = ['M','F'];
      var genderLabel = { M: 'Male', F: 'Female' };
      var genderColor = { M: '#4e79a7', F: '#e15759' };

      var pct = {};
      genders.forEach(function(g) {
        var rows = data.filter(function(d) { return d.gender === g; });
        pct[g] = rows.length ? aiCols.map(function(col) {
          var trues = rows.filter(function(d) { return d[col] === 'TRUE'; }).length;
          return trues / rows.length;
        }) : aiCols.map(function() { return 0; });
      });

      var width = 700, height = 480, cx = 250, cy = 240;

      var svg = d3.select('#donut-container').append('svg')
        .attr('viewBox', '0 0 ' + width + ' ' + height)
        .attr('width', '100%')
        .style('display', 'block');

      var rings = [
        { gender: 'M', innerR: 50, outerR: 105 },
        { gender: 'F', innerR: 115, outerR: 170 }
      ];

      rings.forEach(function(ring) {
        var sum = d3.sum(pct[ring.gender]);
        var cum = 0;

        aiCols.forEach(function(col, i) {
          var val = pct[ring.gender][i];
          if (val === 0) return;

          var a0 = cum / sum * Math.PI * 2 - Math.PI / 2;
          cum += val;
          var a1 = cum / sum * Math.PI * 2 - Math.PI / 2;
          var midA = (a0 + a1) / 2;

          var arcGen = d3.arc().innerRadius(ring.innerR).outerRadius(ring.outerR);

          svg.append('path')
            .attr('transform', 'translate(' + cx + ',' + cy + ')')
            .attr('d', arcGen({ startAngle: a0, endAngle: a1 }))
            .attr('fill', d3.interpolateRgb(genderColor[ring.gender], '#fff')(1 - val))
            .attr('stroke', '#000')
            .attr('stroke-width', 1);

          var labelR = (ring.innerR + ring.outerR) / 2;
          svg.append('text')
            .attr('x', cx + labelR * Math.cos(midA))
            .attr('y', cy + labelR * Math.sin(midA))
            .attr('text-anchor', 'middle')
            .attr('dominant-baseline', 'central')
            .style('font-size', '11px')
            .attr('font-weight', 'bold')
            .attr('fill', '#000')
            .text(Math.round(val * 100) + '%');
        });
      });

      var outerLabelR = 190;
      aiCols.forEach(function(col, i) {
        var sumM = d3.sum(pct.M);
        var sumF = d3.sum(pct.F);

        var cumM = pct.M.slice(0, i).reduce(function(a, b) { return a + b; }, 0);
        var cumF = pct.F.slice(0, i).reduce(function(a, b) { return a + b; }, 0);

        var midM = sumM ? (cumM + pct.M[i] / 2) / sumM * Math.PI * 2 - Math.PI / 2 : -Math.PI / 2;
        var midF = sumF ? (cumF + pct.F[i] / 2) / sumF * Math.PI * 2 - Math.PI / 2 : -Math.PI / 2;

        var a = (midM + midF) / 2;

        svg.append('text')
          .attr('x', cx + outerLabelR * Math.cos(a))
          .attr('y', cy + outerLabelR * Math.sin(a))
          .attr('text-anchor', 'middle')
          .attr('dominant-baseline', 'central')
          .style('font-size', '11px')
          .attr('fill', '#333')
          .text(col);
      });

      var lg = svg.append('g').attr('transform', 'translate(10,30)');
      genders.forEach(function(g, i) {
        lg.append('rect').attr('x', 0).attr('y', i * 22).attr('width', 12).attr('height', 12).attr('fill', genderColor[g]);
        lg.append('text').attr('x', 18).attr('y', i * 22 + 11).style('font-size', '13px').attr('fill', '#000').text(genderLabel[g]);
      });
      lg.append('text').attr('x', 0).attr('y', 55).style('font-size', '11px').attr('fill', '#666').text('Darker = higher %TRUE');
    }

    function renderPage(page) {
      currentPage = page;
      var start = (page - 1) * PER_PAGE;
      var end = start + PER_PAGE;
      var pageData = allData.slice(start, end);
      var totalPages = Math.ceil(allData.length / PER_PAGE);

      var thead = document.getElementById('table-head');
      thead.innerHTML = '<tr>' + headers.map(function(h) {
        return '<th class="px-4 py-2 text-left text-xs font-medium uppercase tracking-wider">' + h + '</th>';
      }).join('') + '</tr>';

      var tbody = document.getElementById('table-body');
      tbody.innerHTML = pageData.map(function(row) {
        return '<tr class="border-t hover:bg-gray-50">' +
          headers.map(function(h) {
            return '<td class="px-4 py-2 whitespace-nowrap">' + (row[h] || '') + '</td>';
          }).join('') + '</tr>';
      }).join('');

      document.getElementById('page-info').textContent = 'Page ' + page + ' of ' + totalPages + ' (' + allData.length + ' entries)';
      document.getElementById('prev-btn').disabled = (page === 1);
      document.getElementById('next-btn').disabled = (page === totalPages);
    }

    document.getElementById('prev-btn').addEventListener('click', function() {
      if (currentPage > 1) renderPage(currentPage - 1);
    });
    document.getElementById('next-btn').addEventListener('click', function() {
      var totalPages = Math.ceil(allData.length / PER_PAGE);
      if (currentPage < totalPages) renderPage(currentPage + 1);
    });
  </script>
</body>
</html>
